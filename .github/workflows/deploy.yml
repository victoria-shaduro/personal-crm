name: Deploy production and staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: personal-crm-build
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check and publish
        run: bash deploy/ci.sh build
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-production:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: personal-crm-production
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy production
        run: bash deploy/ci.sh prod
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: personal-crm-staging
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy staging
        run: bash deploy/ci.sh staging
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
